name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - {os: macos-latest, python-version: "3.10"}
          - {os: macos-latest, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.10"}
          - {os: windows-latest, python-version: "3.13"}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Check the example plan against the example code
        run: python agensi/repo-audit-planner/scripts/check_plans.py examples --repo .

      - name: Check the Agensi package
        run: python tools/agensi_build.py agensi/repo-audit-planner --with examples
